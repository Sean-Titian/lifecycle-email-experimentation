[build-system]
requires = ["setuptools>=77", "wheel>=0.45"]
build-backend = "setuptools.build_meta"

[project]
name = "lifecycle-email-experimentation"
version = "0.4.0"
description = "Public-safe lifecycle messaging experimentation with multiplicity, time-window, and funnel integrity checks."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "Zishen Tian" }]
dependencies = [
  "numpy>=2.0,<3",
  "pandas>=2.2,<4",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "pytest>=8.3,<10",
  "ruff>=0.11,<1",
]

[project.urls]
Repository = "https://github.com/Sean-Titian/lifecycle-email-experimentation"
Issues = "https://github.com/Sean-Titian/lifecycle-email-experimentation/issues"

[project.scripts]
email-experiment = "email_experiment.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
