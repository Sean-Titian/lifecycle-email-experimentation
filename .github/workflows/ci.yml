name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest
      - name: Dependency check
        run: python -m pip check

  package-and-report:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build and test dependencies
        run: |
          python -m pip install -r requirements-benchmark.txt
          python -m pip install -e ".[dev]"
      - name: Rebuild canonical prospective report from source
        run: |
          python -m email_experiment run-prospective-synthetic \
            --output "${RUNNER_TEMP}/prospective-synthetic-benchmark.json"
          cmp reports/prospective-synthetic-benchmark.json \
            "${RUNNER_TEMP}/prospective-synthetic-benchmark.json"
      - name: Build source and wheel distributions
        run: |
          python -m build
          python -c "from pathlib import Path; files=list(Path('dist').iterdir()); assert sum(p.suffix == '.whl' for p in files) == 1; assert sum(p.name.endswith('.tar.gz') for p in files) == 1"
      - name: Verify packaged license notices
        run: |
          python -c "from pathlib import Path; import tarfile; archive=next(Path('dist').glob('*.tar.gz')); names=tarfile.open(archive).getnames(); assert any(name.endswith('/THIRD_PARTY_NOTICES.md') for name in names)"
      - name: Install and smoke-test the wheel outside the source tree
        run: |
          python -m venv "${RUNNER_TEMP}/wheel-smoke"
          "${RUNNER_TEMP}/wheel-smoke/bin/python" -m pip install \
            --constraint requirements-benchmark.txt dist/*.whl
          cd "${RUNNER_TEMP}"
          "${RUNNER_TEMP}/wheel-smoke/bin/email-experiment" --help
          "${RUNNER_TEMP}/wheel-smoke/bin/python" -c "from importlib.metadata import distribution; from email_experiment import __version__; assert __version__ == '0.3.0'; assert any(path.name == 'THIRD_PARTY_NOTICES.md' for path in distribution('lifecycle-email-experimentation').files)"
          "${RUNNER_TEMP}/wheel-smoke/bin/python" -m email_experiment \
            run-prospective-synthetic \
            --output "${RUNNER_TEMP}/wheel-prospective-synthetic-benchmark.json"
          cmp "${GITHUB_WORKSPACE}/reports/prospective-synthetic-benchmark.json" \
            "${RUNNER_TEMP}/wheel-prospective-synthetic-benchmark.json"
          "${RUNNER_TEMP}/wheel-smoke/bin/python" -m pip check
